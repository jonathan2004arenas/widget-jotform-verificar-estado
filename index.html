<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Validador de equipos</title>

  <script src="https://cdn.jotfor.ms/s/umd/latest/for-custom-widgets.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 16x;
      font-family: Arial, sans-serif;
      background: #ffffff;
      color: #202124;
    }

    .widget {
      width: 100%;
      max-width: 320px;
      /* margin: 0 auto; */
    }

    h2 {
      margin: 0 0 16px;
      font-size: 21px;
      text-align: center;
    }

    label {
      display: block;
      margin-bottom: 7px;
      font-weight: bold;
      font-size: 14px;
    }

    .fila {
      display: flex;
      gap: 8px;
    }

    input {
      flex: 1;
      min-width: 0;
      padding: 12px;
      border: 1px solid #c7c7c7;
      border-radius: 6px;
      font-size: 16px;
      text-transform: uppercase;
    }

    button {
      padding: 12px 16px;
      border: none;
      border-radius: 6px;
      background: #2563eb;
      color: white;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      background: #9ca3af;
      cursor: not-allowed;
    }

    .resultado {
      margin-top: 16px;
      padding: 14px;
      border-radius: 8px;
      border: 1px solid #d1d5db;
      background: #f9fafb;
      line-height: 1.5;
      white-space: pre-line;
    }

    .inicial {
      color: #4b5563;
    }

    .consultando {
      color: #1d4ed8;
      background: #eff6ff;
      border-color: #93c5fd;
    }

    .exito {
      color: #166534;
      background: #f0fdf4;
      border-color: #86efac;
    }

    .advertencia {
      color: #92400e;
      background: #fffbeb;
      border-color: #fcd34d;
    }

    .error {
      color: #991b1b;
      background: #fef2f2;
      border-color: #fca5a5;
    }

    .detalle {
      margin-top: 10px;
      font-size: 14px;
    }
  </style>
</head>

<body>
  <div class="widget">
    <h2>Validar equipo</h2>

    <label for="codigoEquipo">
      Código del equipo
    </label>

    <div class="fila">
      <input
        id="codigoEquipo"
        type="text"
        placeholder="Ej: EQ-001"
        autocomplete="off"
      />

      <button id="btnValidar" type="button">
        Validar
      </button>
    </div>

    <div id="resultado" class="resultado inicial">
      Ingrese un código para validar.
    </div>
  </div>

  <script>
    let API_URL = "";
    let SPREADSHEET_ID = "";
    let HOJA = "";
    let COLUMNA_ID = "";

    let datosEncontrados = null;
    let busquedaEnCurso = false;
    let controladorBusqueda = null;
    let numeroBusqueda = 0;

    const codigoEquipo = document.getElementById("codigoEquipo");
    const btnValidar = document.getElementById("btnValidar");
    const resultado = document.getElementById("resultado");

    function mostrarResultado(mensaje, tipo) {
      resultado.className = "resultado " + tipo;
      resultado.textContent = mensaje;
    }

    function normalizarTexto(valor) {
      return String(valor ?? "").trim();
    }

    function obtenerValorRegistro(registro, posiblesNombres) {
      if (!registro || typeof registro !== "object") {
        return "";
      }

      for (const nombre of posiblesNombres) {
        if (
          Object.prototype.hasOwnProperty.call(registro, nombre) &&
          registro[nombre] !== null &&
          registro[nombre] !== undefined
        ) {
          return registro[nombre];
        }
      }

      return "";
    }

    function enviarResultadosJotform({
      validacion,
      existe,
      disponible,
      estado
    }) {
      const valores = {
        EstadoEquipo: estado,
        ValidacionEquipo: validacion,
        EquipoExiste: existe,
        EquipoDisponible: disponible
      };

      console.log("Valores de validación:", valores);

      if (
        typeof JFCustomWidget !== "undefined" &&
        typeof JFCustomWidget.setFieldsValueByLabel === "function"
      ) {
        JFCustomWidget.setFieldsValueByLabel([
          {
            label: "EstadoEquipo",
            value: estado
          },
          {
            label: "ValidacionEquipo",
            value: validacion
          },
          {
            label: "EquipoExiste",
            value: existe
          },
          {
            label: "EquipoDisponible",
            value: disponible
          }
        ]);

        console.log("Campos de validación enviados a Jotform.");
      } else {
        console.error(
          "La API setFieldsValueByLabel no está disponible."
        );
      }

      // Conservamos el resultado del widget
      if (
        typeof JFCustomWidget !== "undefined" &&
        typeof JFCustomWidget.sendData === "function"
      ) {
        JFCustomWidget.sendData({
          value: JSON.stringify(valores)
        });
      }
    }

    function cancelarBusquedaAnterior() {
      if (controladorBusqueda) {
        controladorBusqueda.abort();
        controladorBusqueda = null;
      }
    }

    async function validarEquipo() {
      const codigo = normalizarTexto(codigoEquipo.value).toUpperCase();

      if (!codigo) {
        mostrarResultado(
          "⚠️ Debe ingresar un código de equipo.",
          "advertencia"
        );

        enviarResultadosJotform({
          validacion: "ERROR",
          existe: "NO",
          disponible: "NO",
          estado: "Error"
        });

        return;
      }

      if (!API_URL || !SPREADSHEET_ID || !HOJA || !COLUMNA_ID) {
        mostrarResultado(
          "❌ El widget no está configurado correctamente.",
          "error"
        );

        console.error({
          API_URL,
          SPREADSHEET_ID,
          HOJA,
          COLUMNA_ID
        });

        return;
      }

      cancelarBusquedaAnterior();

      controladorBusqueda = new AbortController();

      const numeroActual = ++numeroBusqueda;

      busquedaEnCurso = true;
      btnValidar.disabled = true;
      btnValidar.textContent = "Consultando...";

      mostrarResultado(
        "🔎 Consultando inventario...\n\nCódigo: " + codigo,
        "consultando"
      );

      try {
        const url =
          API_URL +
          "?spreadsheetId=" +
          encodeURIComponent(SPREADSHEET_ID) +
          "&hoja=" +
          encodeURIComponent(HOJA) +
          "&columnaID=" +
          encodeURIComponent(COLUMNA_ID) +
          "&id=" +
          encodeURIComponent(codigo);

        console.log("Consultando API:", url);

        const respuesta = await fetch(url, {
          method: "GET",
          signal: controladorBusqueda.signal
        });

        if (!respuesta.ok) {
          throw new Error("La API respondió con HTTP " + respuesta.status);
        }

        const datos = await respuesta.json();

        if (numeroActual !== numeroBusqueda) {
          return;
        }

        console.log("Respuesta de la API:", datos);

        const registro =
        datos.datos ||
        datos.registro ||
        datos.data ||
        datos.resultado ||
        null;

        const encontrado =
        datos.encontrado === true ||
        datos.encontrado === "SI" ||
        datos.found === true ||
        datos.existe === true ||
        (
            registro &&
            typeof registro === "object" &&
            (
            registro.ID_EQUIPO ||
            registro.id_equipo ||
            registro.CODIGO_EQUIPO ||
            registro.codigo_equipo
            )
        );

        if (
          !encontrado ||
          !registro ||
          typeof registro !== "object"
        ) {
          datosEncontrados = null;

          mostrarResultado(
            "❌ Equipo no encontrado\n\n" +
            "El código " +
            codigo +
            " no existe en el inventario.",
            "error"
          );

          enviarResultadosJotform({
            validacion: "ERROR",
            existe: "NO",
            disponible: "NO",
            estado: "No encontrado"
          });

          return;
        }

        datosEncontrados = registro;

        const estado = normalizarTexto(
          obtenerValorRegistro(registro, [
            "ESTADO",
            "Estado",
            "estado"
          ])
        );

        const equipo = normalizarTexto(
          obtenerValorRegistro(registro, [
            "TIPO",
            "Tipo",
            "tipo",
            "EQUIPO",
            "Equipo",
            "equipo"
          ])
        );

        const marca = normalizarTexto(
          obtenerValorRegistro(registro, [
            "MARCA",
            "Marca",
            "marca"
          ])
        );

        const modelo = normalizarTexto(
          obtenerValorRegistro(registro, [
            "MODELO",
            "Modelo",
            "modelo"
          ])
        );

        const serial = normalizarTexto(
          obtenerValorRegistro(registro, [
            "SERIAL",
            "Serial",
            "serial"
          ])
        );

        const responsable = normalizarTexto(
          obtenerValorRegistro(registro, [
            "RESPONSABLE",
            "Responsable",
            "responsable"
          ])
        );

        const disponible =
          estado.toLowerCase() === "disponible";

        if (disponible) {
          mostrarResultado(
            "✅ Equipo disponible\n\n" +
            "Código: " + codigo +
            "\nEquipo: " + equipo +
            "\nMarca: " + marca +
            "\nModelo: " + modelo +
            "\nSerial: " + serial +
            "\nEstado: " + estado,
            "exito"
          );
        } else {
          mostrarResultado(
            "⚠️ Equipo no disponible\n\n" +
            "Código: " + codigo +
            "\nEquipo: " + equipo +
            "\nMarca: " + marca +
            "\nModelo: " + modelo +
            "\nSerial: " + serial +
            "\nEstado: " + estado +
            (responsable
              ? "\nResponsable: " + responsable
              : ""),
            "advertencia"
          );
        }

        enviarResultadosJotform({
          validacion: "OK",
          existe: "SI",
          disponible: disponible ? "SI" : "NO",
          estado: estado || "Error"
        });

      } catch (error) {
        if (error.name === "AbortError") {
          return;
        }

        console.error("Error validando equipo:", error);

        mostrarResultado(
          "❌ No fue posible consultar el inventario.\n\n" +
          "Revise la configuración o intente nuevamente.",
          "error"
        );

        enviarResultadosJotform({
          validacion: "ERROR",
          existe: "NO",
          disponible: "NO",
          estado: "Error"
        });

      } finally {
        if (numeroActual === numeroBusqueda) {
          busquedaEnCurso = false;
          btnValidar.disabled = false;
          btnValidar.textContent = "Validar";
        }
      }
    }

    btnValidar.addEventListener("click", validarEquipo);

    codigoEquipo.addEventListener("keydown", function(evento) {
      if (evento.key === "Enter") {
        evento.preventDefault();
        validarEquipo();
      }
    });

    JFCustomWidget.subscribe("ready", function() {
      console.log("Widget validador listo.");

      API_URL = JFCustomWidget.getWidgetSetting("apiUrl") || "";
      SPREADSHEET_ID =
        JFCustomWidget.getWidgetSetting("spreadsheetId") || "";
      HOJA = JFCustomWidget.getWidgetSetting("hoja") || "";
      COLUMNA_ID =
        JFCustomWidget.getWidgetSetting("columnaId") || "";

      console.log("Configuración recibida:", {
        API_URL,
        SPREADSHEET_ID,
        HOJA,
        COLUMNA_ID
      });

      if (
        typeof JFCustomWidget.requestFrameResize === "function"
      ) {
        JFCustomWidget.requestFrameResize({
          height: 360
        });
      }
    });

    JFCustomWidget.subscribe("submit", function() {
      JFCustomWidget.sendSubmit({
        value: JSON.stringify({
          codigo: codigoEquipo.value,
          datos: datosEncontrados
        })
      });
    });
  </script>
</body>
</html>
